[project]
name = "flowmaster-gateway"
version = "0.1.0"
description = "Single entry point for the frontend: auth validation, rate limiting, routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "websockets>=12.0",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "flowmaster-query-api"
version = "0.1.0"
description = "Dashboard summary, drill-down, historical query, and reporting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "clickhouse-connect>=0.7",
    "asyncpg>=0.29",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "flowmaster-identity"
version = "0.1.0"
description = "Users, roles, sites, auth (session + API tokens), and the audit log"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "passlib[bcrypt]>=1.7",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

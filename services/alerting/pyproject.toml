[project]
name = "flowmaster-alerting"
version = "0.1.0"
description = "Alert rule evaluation against the event stream, with notification delivery and de-dup"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "redis>=5.0",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis,kafka]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

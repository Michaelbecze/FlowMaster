[project]
name = "flowmaster-flow-writer"
version = "0.1.0"
description = "Consumes flow-records.v1, batches into ClickHouse, runs retention purge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka>=0.11",
    "clickhouse-connect>=0.7",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[kafka]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

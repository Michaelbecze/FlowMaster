[project]
name = "flowmaster-ingestion"
version = "0.1.0"
description = "NetFlow v5 UDP listener and event-stream producer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "flowmaster-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[kafka,postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
